<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Typewriter Code</title>
    <style>
      :root {
        --bg: #0b0b0c;
        --fg: #d8d8c8;
        --fn: #6fd3e8;
        --str: #b9d36c;
        --kw: #e06bd0;
        --br: #e8a35a;
        --cur: #ff2d2d;
        --dim: #6a6a62;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b0b0c;
          --fg: #d8d8c8;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0b0c;
        --fg: #d8d8c8;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }
      body {
        font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
        cursor: pointer;
      }
      #scene {
        position: fixed;
        inset: 0;
        perspective: 800px;
        overflow: hidden;
      }
      #dolly,
      #tilt {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      #dolly {
        animation: dolly 8s ease-in-out infinite alternate;
      }
      @keyframes dolly {
        from {
          transform: translateZ(-160px);
        }
        to {
          transform: translateZ(170px);
        }
      }
      #tilt {
        animation: sway 11s ease-in-out infinite alternate;
      }
      @keyframes sway {
        from {
          transform: rotateX(7deg) rotateY(-17deg) rotateZ(-1.5deg);
        }
        to {
          transform: rotateX(12deg) rotateY(-5deg) rotateZ(1deg);
        }
      }
      #cam {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(86vw, 880px);
        transform-origin: 50% 0;
        transform: translate(-50%, 0);
        transition: transform 1.1s cubic-bezier(0.25, 0.7, 0.2, 1);
      }
      #cam.pan {
        transition: transform 0.6s linear;
      }
      #stage {
        animation: focus 5s ease-in-out infinite;
      }
      @keyframes focus {
        0%,
        100% {
          filter: blur(0);
        }
        50% {
          filter: blur(1.4px);
        }
      }
      .line {
        position: relative;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: clamp(14px, 3.8vw, 24px);
        line-height: 1.6;
        margin: 0.7em 0;
        transition:
          opacity 0.8s,
          filter 0.8s;
      }
      .fn {
        color: var(--fn);
      }
      .str {
        color: var(--str);
      }
      .kw {
        color: var(--kw);
      }
      .br {
        color: var(--br);
      }
      .cur {
        display: inline-block;
        width: 0.6em;
        height: 1.1em;
        background: var(--cur);
        vertical-align: text-bottom;
        margin-left: 2px;
        box-shadow: 0 0 12px var(--cur);
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.25;
        }
      }
      #vig {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0, 0, 0, 0.85) 100%
        );
      }
      #hint {
        position: fixed;
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        color: var(--dim);
        opacity: 0;
        transition: opacity 0.6s;
      }
      #hint.show {
        opacity: 1;
      }
      #toggle {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top, 0px));
        right: 12px;
        z-index: 5;
        font: inherit;
        font-size: 13px;
        color: var(--fg);
        background: rgba(30, 30, 28, 0.85);
        border: 1px solid #3a3a36;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }
      #panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        box-sizing: border-box;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
        background: #141413;
        border-top: 1px solid #3a3a36;
        display: none;
        cursor: auto;
      }
      #panel.open {
        display: block;
      }
      #panel textarea {
        width: 100%;
        height: 32vh;
        box-sizing: border-box;
        background: #0b0b0c;
        color: var(--fg);
        border: 1px solid #3a3a36;
        border-radius: 8px;
        padding: 10px;
        font: inherit;
        font-size: 14px;
        resize: none;
      }
      #panel .row {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }
      #panel button {
        font: inherit;
        font-size: 13px;
        color: #0b0b0c;
        background: var(--str);
        border: 0;
        border-radius: 8px;
        padding: 9px 16px;
        cursor: pointer;
      }
      @media (prefers-reduced-motion: reduce) {
        #dolly,
        #tilt,
        #stage {
          animation: none;
        }
        #tilt {
          transform: rotateX(8deg) rotateY(-10deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div id="dolly">
        <div id="tilt">
          <div id="cam"><div id="stage"></div></div>
        </div>
      </div>
    </div>
    <div id="vig"></div>
    <button id="toggle">✎ Ganti teks</button>
    <div id="panel">
      <textarea
        id="box"
        placeholder="Tempel teks di sini, satu baris untuk satu baris di layar"
      ></textarea>
      <div class="row"><button id="go">Putar</button></div>
    </div>
    <div id="hint"></div>
    <script>
      // ====== GANTI TEKS & WAKTU DI SINI ======
      let LINES = [
        'me.keep("isih tak kangenni")',
        '{ held: "isih tak tunggoni" }',
        'it.wont("isih tak tangisi")',
        '{ feel: "kenangannnn sing wingiiiii" }',
        'me.say("MABURR DHUWURR")',
        '{ be: "melayangg-melayangggggggggg" }',
        'it.keep("terbang di atas awan.....")',
        '{ held: "ingin melepasss..." }',
        'me.say("Rinduuu"){ attitude: "SAYANGGGGGGG" }',
        "//NEGORO ANGIN, -Denny Caknan-",
      ];
      // detik mulai tiap baris (detik 0 = saat hitung mundur selesai).
      // jumlahnya harus sama dengan jumlah LINES.
      let STARTS = [
        0.0, 4.01, 7.13, 10.22, 15.05, 17.22, 22.0, 25.21, 28.28, 33.2,
      ];
      const END_AT = 35.0; // durasi lagu (detik)
      const COUNTDOWN = 3; // hitung mundur sebelum mulai (detik)
      const TYPE_MAX = 0.11; // paling lambat: detik per huruf
      // =========================================

      const cam = document.getElementById("cam");
      const stage = document.getElementById("stage");
      const hint = document.getElementById("hint");
      const esc = (s) =>
        s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      function hl(s) {
        return esc(s).replace(
          /("[^"]*"?)|\b(me|it)\b|\b([a-z_]+)(?=\()|\b([a-z_]+)(?=:)|([(){}])/gi,
          (m, str, who, fn, key, br) =>
            str
              ? `<span class="str">${str}</span>`
              : who
                ? `<span class="kw">${who}</span>`
                : fn
                  ? `<span class="fn">${fn}</span>`
                  : key
                    ? `<span class="kw">${key}</span>`
                    : `<span class="br">${br}</span>`,
        );
      }

      function follow(el, pan) {
        const cur = el.querySelector(".cur");
        const y =
          el.offsetTop +
          (cur ? cur.offsetTop + cur.offsetHeight / 2 : el.offsetHeight / 2);
        const x = cur ? -(cur.offsetLeft - cam.clientWidth * 0.5) * 0.3 : 0;
        cam.classList.toggle("pan", !!pan);
        cam.style.transform = `translate(calc(-50% + ${x}px), ${-y}px)`;
      }

      function depth(els, i) {
        els.forEach((e, k) => {
          const age = i - k;
          e.style.opacity = age === 0 ? 1 : Math.max(0.15, 0.8 - age * 0.22);
          e.style.filter =
            age === 0 ? "none" : `blur(${Math.min(age * 1.6, 5)}px)`;
        });
      }

      // kalau jumlah baris tidak sama dengan STARTS (mis. teks dari kotak tempel), bagi rata
      function getStarts() {
        if (STARTS.length === LINES.length) return STARTS;
        return LINES.map((_, i) => (i * END_AT * 0.95) / LINES.length);
      }

      let run = 0;

      function play() {
        const id = ++run;
        const starts = getStarts();
        const els = [];
        stage.innerHTML = "";
        hint.classList.remove("show");
        cam.classList.remove("pan");
        cam.style.transform = "translate(-50%,0)";

        // baris baru muncul sedikit lebih awal supaya kamera sempat pindah
        const lead = (i) =>
          i ? Math.min(0.7, 0.15 * (starts[i] - starts[i - 1])) : 0;

        const make = (i) => {
          const el = document.createElement("div");
          el.className = "line";
          el.innerHTML = '<span class="cur"></span>';
          stage.appendChild(el);
          els.push(el);
          depth(els, i);
          follow(el, false);
        };

        const finish = () => {
          while (els.length < LINES.length) make(els.length);
          els.forEach((e, i) => {
            e.style.opacity = 0.95;
            e.style.filter = "none";
            e.innerHTML = hl(LINES[i]);
          });
          els[els.length - 1].innerHTML =
            hl(LINES[LINES.length - 1]) + '<span class="cur"></span>';
          const h = stage.offsetHeight;
          const s = Math.min(1, (innerHeight * 0.7) / h);
          cam.classList.remove("pan");
          cam.style.transform = `translate(-50%, ${-(h * s) / 2}px) scale(${s})`;
          hint.textContent = "ketuk layar untuk mengulang";
          hint.classList.add("show");
        };

        make(0);
        let lastA = -1,
          lastN = -1;
        const t0 = performance.now() + COUNTDOWN * 1000;

        const tick = () => {
          if (id !== run) return;
          const t = (performance.now() - t0) / 1000;

          if (t < 0) {
            hint.textContent = "mulai dalam " + Math.ceil(-t);
            hint.classList.add("show");
            return requestAnimationFrame(tick);
          }
          hint.classList.remove("show");

          while (
            els.length < LINES.length &&
            t >= starts[els.length] - lead(els.length)
          )
            make(els.length);

          let a = 0;
          for (let i = 0; i < els.length; i++) if (t >= starts[i]) a = i;

          for (let i = 0; i < a; i++) {
            if (els[i].dataset.done !== "1") {
              els[i].innerHTML = hl(LINES[i]);
              els[i].dataset.done = "1";
            }
          }

          const txt = LINES[a];
          const slot = (starts[a + 1] ?? END_AT) - starts[a];
          const dur = Math.max(
            0.1,
            Math.min(slot * 0.85, txt.length * TYPE_MAX),
          );
          const n = Math.max(
            0,
            Math.min(
              txt.length,
              Math.floor(((t - starts[a]) / dur) * txt.length),
            ),
          );

          if (a !== lastA || n !== lastN) {
            els[a].innerHTML =
              hl(txt.slice(0, n)) + '<span class="cur"></span>';
            if (a === els.length - 1) follow(els[a], true);
            lastA = a;
            lastN = n;
          }

          if (t >= END_AT) return finish();
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      // ===== kotak tempel teks: ubah tiap baris jadi gaya kode =====
      const panel = document.getElementById("panel"),
        box = document.getElementById("box");
      const VERBS = ["keep", "say", "wont", "keep", "say"],
        ATTRS = ["held", "feel", "be", "attitude"];
      function toCode(raw) {
        return raw
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter(Boolean)
          .slice(0, 60)
          .map((l, n) => {
            const w = l.replace(/"/g, "'").split(/\s+/);
            const kw = w.slice(0, Math.min(2, Math.max(1, w.length - 1)));
            const rest = w.slice(kw.length);
            const key =
              kw
                .join("_")
                .toLowerCase()
                .replace(/[^a-z0-9_]/g, "") || "baris";
            const val = rest.length ? rest.join(" ") : w.join(" ");
            return `${n % 2 ? "it" : "me"}.${VERBS[n % VERBS.length]}("${key}"){ ${ATTRS[n % ATTRS.length]}: "${val}" }`;
          });
      }
      document
        .getElementById("toggle")
        .addEventListener("click", () => panel.classList.toggle("open"));
      document.getElementById("go").addEventListener("click", () => {
        const out = toCode(box.value);
        if (!out.length) return;
        LINES = out;
        panel.classList.remove("open");
        play();
      });
      document.getElementById("scene").addEventListener("click", play);

      // layar awal: menunggu ketukan
      stage.innerHTML = '<div class="line"><span class="cur"></span></div>';
      hint.textContent = "ketuk layar untuk mulai";
      hint.classList.add("show");
    </script>
  </body>
</html>
